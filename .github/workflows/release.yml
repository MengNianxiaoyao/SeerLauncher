name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "startsWith(github.event.head_commit.message, 'chore: v')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $msg = "${{ github.event.head_commit.message }}"
          $ver = $msg -replace '^chore: v(.+)$', '$1'
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build
        run: msbuild SeerLauncher.sln /restore /p:Configuration=Release

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path SeerLauncher/bin/Release/net48/*.exe -DestinationPath SeerLauncher.zip

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ github.event.head_commit.message }}
          files: SeerLauncher.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}