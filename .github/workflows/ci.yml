name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild SeerLauncher.sln /restore /p:Configuration=Release

      - name: Test
        run: dotnet test SeerLauncher.Tests\SeerLauncher.Tests.csproj -c Release --no-build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SeerLauncher
          path: SeerLauncher/bin/Release/**/*